name: Verify pinned upstream source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm run verify:sources
      - run: |
          if ! command -v bison || ! command -v flex || ! command -v m4; then
            sudo apt-get update -qq
            sudo apt-get install -y bison flex m4
          fi
      - run: |
          curl --fail --location --retry 2 --max-time 600 https://codeload.github.com/raspberrypi/linux/tar.gz/e442e5c1ab6bff5b5460b4fc949beb72aaf77970 -o "$RUNNER_TEMP/linux.tar.gz"
          tar -xzf "$RUNNER_TEMP/linux.tar.gz" -C "$RUNNER_TEMP"
          node scripts/kconfig-fixtures.js
          bash tests/build-conf.sh "$RUNNER_TEMP/linux-e442e5c1ab6bff5b5460b4fc949beb72aaf77970" "$RUNNER_TEMP/conf-build"
          python3 tests/kconfig.py "$RUNNER_TEMP/linux-e442e5c1ab6bff5b5460b4fc949beb72aaf77970" "$RUNNER_TEMP/conf-build/conf"
